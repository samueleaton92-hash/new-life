<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waybook — an AI-run adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ SETUP ============ -->
<main id="setup" class="setup">
  <div class="setup-card">
    <header class="setup-head">
      <span class="setup-eyebrow">Waybook</span>
      <h1>Waybook</h1>
      <p class="setup-sub">Drop in a key, roll for a story, go.</p>
    </header>

    <label class="field">
      <span class="field-label">Anthropic API key</span>
      <input type="password" id="apiKey" placeholder="sk-ant-..." autocomplete="off">
      <span class="field-hint">Stays in your browser. Never sent anywhere but api.anthropic.com.</span>
    </label>
    <label class="field">
      <span class="field-label">Model</span>
      <select id="model">
        <option value="claude-sonnet-5">Claude Sonnet 5 — balanced (recommended)</option>
        <option value="claude-opus-5">Claude Opus 5 — richest prose, slower</option>
        <option value="claude-haiku-4-5-20251001">Claude Haiku 4.5 — fastest, leanest</option>
      </select>
    </label>
    <label class="field-check">
      <input type="checkbox" id="rememberKey">
      <span>Remember key on this device (stored in localStorage — only do this on a private machine)</span>
    </label>

    <div class="quickstart-row">
      <button type="button" id="newAdventureBtn" class="primary-btn quickstart-btn">🎲 New Adventure</button>
      <button type="button" id="newLifeBtn" class="primary-btn quickstart-btn life-btn">🎂 New Life at 18</button>
    </div>
    <button type="button" id="customizeToggle" class="text-link-btn">Customize manually instead</button>

    <p class="setup-error" id="setupError" hidden></p>

    <!-- ===== Manual customize form (hidden by default) ===== -->
    <section id="customizeForm" class="customize-form" hidden>
      <label class="field">
        <span class="field-label">Setting</span>
        <textarea id="setting" rows="3" placeholder="A drowned coastal city where the tide only goes out once a decade, revealing streets nobody living has walked."></textarea>
      </label>
      <div class="chip-row" data-fill-target="setting">
        <button type="button" class="chip" data-value="A frontier mining town on a moon with two gravities, one honest and one not.">Sci-fi frontier</button>
        <button type="button" class="chip" data-value="A low fantasy kingdom in its last good decade before the long winter everyone can feel coming.">Waning fantasy kingdom</button>
        <button type="button" class="chip" data-value="A 1920s port city run by three rival smuggling families and one incorruptible harbourmaster.">Smuggler's port, 1920s</button>
      </div>

      <label class="field">
        <span class="field-label">Your character's name</span>
        <input type="text" id="charName" placeholder="Mireille Auberon">
      </label>
      <label class="field">
        <span class="field-label">Who are they?</span>
        <textarea id="charDesc" rows="3" placeholder="A disbarred cartographer who reads currents like other people read faces. Owes a debt she can't pay in money."></textarea>
      </label>
      <div class="two-col three-col">
        <label class="field">
          <span class="field-label">Starting HP</span>
          <input type="number" id="startHp" value="20" min="1" max="200">
        </label>
        <label class="field">
          <span class="field-label">Starting cash</span>
          <input type="number" id="startCash" value="20" min="0" max="100000">
        </label>
      </div>

      <span class="field-label">Party members <span class="field-hint-inline">(optional)</span></span>
      <div id="partyList" class="party-list"></div>
      <button type="button" id="addPartyMember" class="ghost-btn">+ Add companion</button>

      <label class="field" style="margin-top:18px;">
        <span class="field-label">What are you after?</span>
        <textarea id="quest" rows="3" placeholder="Find out what actually happened to the last expedition, and whether it's worth repeating their mistake."></textarea>
      </label>
      <label class="field">
        <span class="field-label">Starting items <span class="field-hint-inline">(comma separated, optional)</span></span>
        <input type="text" id="startItems" placeholder="brass compass, half a map, a debt letter">
      </label>

      <button type="button" id="beginCustomBtn" class="primary-btn">Begin expedition</button>
    </section>
  </div>
</main>

<!-- ============ GAME SCREEN ============ -->
<div id="game" class="game" hidden>
  <aside class="dossier">
    <div class="dossier-head">
      <span class="dossier-label">Dossier</span>
      <h2 id="dChar">—</h2>
    </div>

    <div class="stat-block">
      <div class="stat-row">
        <span class="stat-name">HP</span>
        <div class="hp-track"><div class="hp-fill" id="hpFill"></div></div>
        <span class="stat-value" id="hpText">—</span>
      </div>
      <div class="stat-row">
        <span class="stat-name">Cash</span>
        <span class="stat-value cash-value" id="cashText">—</span>
      </div>
    </div>

    <div class="dossier-section">
      <span class="dossier-label">Status</span>
      <ul id="statusList" class="status-list"></ul>
    </div>

    <div class="dossier-section">
      <span class="dossier-label">Party</span>
      <ul id="partyRoster" class="roster"></ul>
    </div>

    <div class="dossier-section">
      <span class="dossier-label">Inventory</span>
      <ul id="inventory" class="inventory-list"></ul>
    </div>

    <div class="dossier-section quest-box">
      <span class="dossier-label">Quest</span>
      <p id="dQuest"></p>
    </div>

    <button type="button" id="newGameBtn" class="ghost-btn small">🔁 New game</button>
  </aside>

  <section class="journal">
    <div class="journal-log" id="log"></div>

    <form class="journal-input" id="actionForm">
      <input type="text" id="actionInput" placeholder="What do you do?" autocomplete="off">
      <button type="submit" id="sendBtn">Act</button>
      <button type="button" id="continueBtn" class="continue-btn">Continue →</button>
    </form>
    <p class="journal-error" id="gameError" hidden></p>
  </section>
</div>

<script src="app.js"></script>
</body>
</html>
